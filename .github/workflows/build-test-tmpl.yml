name: Build, test, validate

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      generate-catalog:
        required: true
        type: boolean
    secrets:
      token:
        required: true

jobs:
  build_and_test:
    name: '${{ matrix.os }}: build and test'
    runs-on: ${{ matrix.os }}
    # The token this job receives is granted by the caller, in 'build-test.yml':
    # this workflow is invoked once with 'generate-catalog: true' and twice with
    # 'false', and only the former needs to write. Since a job cannot vary its
    # 'permissions' according to an input, declaring the grant here would hand the
    # write scopes to the ordinary build and test invocations too.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.runs-on) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        submodules: true
        ssh-key: ${{ secrets.token }}
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        name: catalog
      if: inputs.generate-catalog != true
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
      with:
        node-version: '24.x'
    - run: npm install
    - run: npm run generate-catalog
      env:
        GITHUB_TOKEN: ${{ github.token }}
      if: inputs.generate-catalog == true
    - run: npm run test
    - uses: ./
      name: validation test by running get-cmake
    - name: CMake version check
      run: |
        which cmake
        cmake --version
        CMAKE_LATEST=`cat .latest_cmake_version`
        CMAKE_VER="$(cmake --version)"
        if ! [[ "$CMAKE_VER" =~ .*"${CMAKE_LATEST}".* ]]; then
          echo "ASSERTION FAILED! Instead of '${CMAKE_LATEST}', found: "
          echo "$CMAKE_VER"
          exit -1
        fi
      shell: bash
    - name: ninja version check
      run: |
        which ninja
        ninja --version
        NINJA_LATEST=`cat .latest_ninja_version`
        NINJA_VER="$(ninja --version)"
        if ! [[ "$NINJA_VER" =~ .*"${NINJA_LATEST}".* ]]; then
          echo "ASSERTION FAILED! Instead of '${NINJA_LATEST}', found: "
          echo "$NINJA_VER"
          exit -1
        fi
      shell: bash
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: catalog
        # The marker files are hidden, and upload-artifact drops hidden files unless
        # told otherwise: without this the artifact would carry the catalog alone, and
        # the downstream jobs would validate the freshly installed CMake and Ninja
        # against the stale marker files committed in the branch being built.
        include-hidden-files: true
        path: |
          .latest_ninja_version
          .latest_cmake_version
          src/releases-catalog.ts
      if: inputs.generate-catalog == true

    - name: If there is a new CMake version, create a Git commit for the PR
      id: git-check
      run: |
        # Compare the freshly generated versions against 'main', the branch the
        # automated pull request targets, and not against the checked out ref: a
        # branch forked before the last version bump still carries the previous
        # version, hence it would look like it introduces a new one and would spawn
        # a duplicate of an already merged automated pull request.
        git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
        if ! git diff --exit-code origin/main -- .latest_cmake_version ; then
          export CMAKE_NEW_VERSIONS=cmake-v$(cat .latest_cmake_version)
        fi
        if ! git diff --exit-code origin/main -- .latestrc_cmake_version ; then
          export CMAKE_NEW_VERSIONS="${CMAKE_NEW_VERSIONS} cmake-rc-v$(cat .latestrc_cmake_version)"
        fi
        if [[ -n "${CMAKE_NEW_VERSIONS}" ]]; then
          # Get rid of blank space if any
          CMAKE_NEW_VERSIONS="${CMAKE_NEW_VERSIONS// /}"
          CMAKE_NEW_VERSIONS="${CMAKE_NEW_VERSIONS## }"
          echo "CMAKE_NEW_VERSIONS=${CMAKE_NEW_VERSIONS}" >> "$GITHUB_ENV"
          git add -u
          git commit -m "New CMake version(s): $CMAKE_NEW_VERSIONS"
          echo "createpr=true" >> $GITHUB_OUTPUT
        else
          echo "There is no new version of CMake."
        fi
      if: ${{ inputs.generate-catalog == true }}

    - name: Create the PR for new CMake version(s)
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
      with:
        title: '[Automated] Adding ${{ env.CMAKE_NEW_VERSIONS }}'
        body: "Add to catalog new CMake version(s): ${{ env.CMAKE_NEW_VERSIONS }}"
        draft: true
        branch: automated-pr-cmake-${{ env.CMAKE_NEW_VERSIONS}}
        base: main
        add-paths: |
            dist/*.js
            .latest_cmake_version
            .latestrc_cmake_version
      if: ${{ (steps.git-check.outputs.createpr == 'true') }}
