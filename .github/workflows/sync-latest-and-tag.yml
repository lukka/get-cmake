name: 'Sync latest branch and create release tag'

# This workflow synchronizes the 'latest' branch with 'main' and creates a version tag
# and publishes a GitHub release. Trigger it manually after a new CMake version PR is merged to main.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v4.2.3)'
        required: true
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  sync_and_tag:
    name: 'Sync latest branch and create tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate tag name
        id: check_tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          # Validate tag format (should start with 'v' and be followed by version)
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Tag name '$TAG_NAME' does not match expected format (e.g., v4.2.3 or v4.2.3-rc1)"
            exit 1
          fi
          
          # Check if tag already exists remotely
          TAG_REF=$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")
          if [[ -n "$TAG_REF" ]]; then
            echo "Tag $TAG_NAME already exists, skipping tag creation"
            echo "SHOULD_CREATE_TAG=false" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_CREATE_TAG=true" >> $GITHUB_OUTPUT
          fi
          
          echo "✓ Tag name validated: $TAG_NAME"

      - name: Update latest branch to match main
        run: |
          # Fetch all branches
          git fetch origin

          # Get the current commit SHA of main
          MAIN_SHA=$(git rev-parse HEAD)
          echo "Main branch is at commit: $MAIN_SHA"

          # Force update the latest branch to match main
          git push origin HEAD:refs/heads/latest --force
          echo "✓ Latest branch updated to match main"

      - name: Create and push tag
        if: steps.check_tag.outputs.SHOULD_CREATE_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -e
          COMMIT_SHA=$(git rev-parse HEAD)
          
          # Create tag object using GitHub API (this creates a verified tag)
          TAG_SHA=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG_NAME" \
            -f message="Release $TAG_NAME" \
            -f object="$COMMIT_SHA" \
            -f type="commit" \
            --jq '.sha')
          
          # Validate that we got a valid SHA
          if [[ -z "$TAG_SHA" || "$TAG_SHA" == "null" ]]; then
            echo "Error: Failed to create tag object or received invalid SHA"
            exit 1
          fi
          
          echo "Created tag object with SHA: $TAG_SHA"
          
          # Create reference to the tag
          TAG_REF=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$TAG_SHA" \
            --jq '.ref')
          
          # Validate the reference was created
          if [[ -z "$TAG_REF" || "$TAG_REF" == "null" ]]; then
            echo "Error: Failed to create tag reference"
            exit 1
          fi
          
          echo "✓ Verified tag $TAG_NAME created and pushed"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists, leaving it unchanged"
            exit 0
          fi

          RELEASE_FLAGS=()
          if [[ "$TAG_NAME" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CMake ${TAG_NAME}" \
            "${RELEASE_FLAGS[@]}" \
            --notes-file - <<EOF
          The \`get-cmake\` action downloads and caches CMake and Ninja on your workflows. Versions can be specified using [semantic versioning ranges](https://docs.npmjs.com/about-semantic-versioning) using [\`cmakeVersion\`](https://github.com/lukka/get-cmake/blob/latest/action.yml#L13) and [\`ninjaVersion\`](https://github.com/lukka/get-cmake/blob/latest/action.yml#L16) inputs.

          Changes:
           - \`latest\` is now using CMake version \`${TAG_NAME}\`, use this one-liner e.g.:
           \`uses: lukka/get-cmake@latest\`

          Enjoy!
          EOF

      - name: Summary
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          SHOULD_CREATE_TAG: ${{ steps.check_tag.outputs.SHOULD_CREATE_TAG }}
        run: |
          echo "## Release completed successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✓ Latest branch synced with main" >> $GITHUB_STEP_SUMMARY
          if [[ "$SHOULD_CREATE_TAG" == "true" ]]; then
            echo "- ✓ Tag \`${TAG_NAME}\` created" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✓ Existing tag \`${TAG_NAME}\` preserved" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- ✓ [GitHub release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}) published or already present" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can now reference this release using:" >> $GITHUB_STEP_SUMMARY
          echo "- \`@latest\` - for the latest stable version" >> $GITHUB_STEP_SUMMARY
          echo "- \`@${TAG_NAME}\` - for this specific version" >> $GITHUB_STEP_SUMMARY
