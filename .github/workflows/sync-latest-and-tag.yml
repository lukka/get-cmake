name: 'Sync latest branch and create release tag'

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag matching the update (v4.4.4, v4.5.0-rc1, or ninja-v1.13.1); existing tags are preserved'
        required: false
        type: string
      base_ref:
        description: 'Optional comparison ref for combined updates; defaults to the release commit first parent'
        required: false
        type: string

concurrency:
  group: release-workflow
  cancel-in-progress: false
  queue: max

jobs:
  sync_and_tag:
    name: 'Publish CMake and Ninja updates'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Publish release or recover an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
          BASE_REF: ${{ inputs.base_ref }}
        run: node .github/scripts/publish-release.js
