name: 'build-test'

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  verify_dist:
    name: 'Verify that dist/ is up to date'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run pack
      - name: Assert that dist/ matches the sources
        run: |
          if ! git diff --exit-code -- dist/ ; then
            echo "ASSERTION FAILED! The content of 'dist/' does not match the sources: "
            echo "run 'npm run pack' and commit the updated 'dist/index.js'."
            exit 1
          fi
        shell: bash

  generate_catalog_build_and_test:
    # This is the only invocation that writes: it pushes the branch holding the
    # refreshed catalog and opens the automated pull request for it. Every scope
    # left out of this block is dropped to 'none'.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build-test-tmpl.yml
    with:
      runs-on: "['macos-latest']"
      generate-catalog: true
    secrets:
      token:
        ${{ secrets.SSH_PRIVATE_KEY }}

  build_and_test:
    needs: generate_catalog_build_and_test
    # These invocations only build and test the action: reading the sources is all
    # the token is needed for.
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-tmpl.yml
    with:
      runs-on: "['windows-latest', 'ubuntu-latest']"
      generate-catalog: false
    secrets:
      token:
        ${{ github.token }}

  build_and_test_arm:
    needs: generate_catalog_build_and_test
    if: false #Disable buildjet's arm based runners usage.
    permissions:
      contents: read
    uses: ./.github/workflows/build-test-tmpl.yml
    with:
      runs-on: "['buildjet-2vcpu-ubuntu-2204-arm']"
      generate-catalog: false
    secrets:
      token:
        ${{ github.token }}

  test_user_provided_version:
    needs: build_and_test
    uses: ./.github/workflows/functional-tests-tmpl.yml
    with:
      runs-on: "['ubuntu-latest', 'macos-latest', 'windows-latest']"
      versions: "[\"{'cmake':'','ninja':''}\",\
        \"{cmake:'3.22.6', 'ninja':'1.11.1'}\",\
        \"{'cmake':'3.25.0-rc4','ninja':'latest'}\",\
        \"{'cmake':'latest','ninja':'~1.10.0'}\",\
        \"{'cmake':'latestrc','ninja':'^1.11.0'}\",\
        \"{'cmake':'~3.25.0','ninja':''}\",\
        \"{'cmake':'^3.1.1','ninja':''}\",\
        \"{'cmake':'~3.0.0','ninja':''}\"]"
    secrets:
      token:
        ${{ github.token }}

  test_user_provided_version_arm:
    needs: build_and_test_arm
    uses: ./.github/workflows/functional-tests-tmpl.yml
    if: false #Disable buildjet's arm based runners usage.
    with:
      runs-on: "['buildjet-2vcpu-ubuntu-2204-arm']"
      experimental: true
      versions: "[\"{'cmake':'','ninja':''}\",\
        \"{cmake:'3.22.6', 'ninja':'1.11.1'}\",\
        \"{'cmake':'3.25.0-rc4','ninja':'latest'}\",\
        \"{'cmake':'latest','ninja':'~1.10.0'}\",\
        \"{'cmake':'latestrc','ninja':'^1.11.0'}\",\
        \"{'cmake':'~3.25.0','ninja':''}\",\
        \"{'cmake':'^3.1.1','ninja':''}\"]"
    secrets:
      token:
        ${{ github.token }}
