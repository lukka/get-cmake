name: 'Auto-release on tool version update'

# The full push range covers merge commits, squash merges, and rebased PRs.
on:
  push:
    branches:
      - main
    paths:
      - '.latest_cmake_version'
      - '.latestrc_cmake_version'
      - '.latest_ninja_version'

concurrency:
  group: release-workflow
  cancel-in-progress: false
  queue: max

jobs:
  auto_release:
    name: 'Publish CMake and Ninja updates'
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout trusted release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Publish release for pushed version changes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.after }}
          BASE_REF: ${{ github.event.before }}
        run: node .github/scripts/publish-release.js
